<html>
    <head>
        <title>Newsletter</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel="stylesheet" type="text/css" href="Balatro.css">
    </head>
    <body>
        <div class="balatro-background" aria-hidden="true">
            <canvas class="balatro__canvas"></canvas>
        </div>
        <main class="newsletter-page">
        <!-- From Uiverse.io by 0xnihilism --> 
        <div class="card">
        <span class="card__title"> Our Newsletter</span>
        <p class="card__content">
            Get existential crisis delivered straight to your inbox every week.
        </p>
        <form class="card__form">
            <input required="" type="email" placeholder="Your email" />
            <button class="card__button">Sign Up</button>
        </form>
        </div>
        </main>
        <script src="Balatro.js" defer></script>
    </body>
</html>
